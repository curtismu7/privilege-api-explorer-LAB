# OrbStack:  HOST_PORT=7813 docker compose up --build -d   ->  http://127.0.0.1:7813/api/health
# The server binds 0.0.0.0 INSIDE the container (PAE_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below: Real can act on the Privilege console (a test pins it).
# Mock is the default and needs nothing. Real stays refused unless you start it with PRIVILEGE_EXPLORER_MODE=real in your shell.
name: privilege-api-explorer-lab

services:
  privilege-api-explorer-lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7813}:7813"
    environment:
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      PORT: "7813"
      PAE_BIND: 0.0.0.0
      PAE_CONTAINER: "1"
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-privilege-api-explorer.local.ping-devops.com}
      PAE_DATA_DIR: /data
      PRIVILEGE_EXPLORER_MODE: ${PRIVILEGE_EXPLORER_MODE:-mock}
      PRIV_EXPLORER_API_KEY: ${PRIV_EXPLORER_API_KEY:-}
      PRIV_EXPLORER_API_SECRET: ${PRIV_EXPLORER_API_SECRET:-}
      PRIV_LOG_CONSOLE_URL: ${PRIV_LOG_CONSOLE_URL:-}
      PRIV_LOG_CONSOLE_TENANT: ${PRIV_LOG_CONSOLE_TENANT:-}
      PRIV_LOG_CONSOLE_CA: ${PRIV_LOG_CONSOLE_CA:-}
    extra_hosts:
      - "local.procyon.ai:host-gateway"
    volumes:
      - pae-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Liveness plus "not broken": needs-setup (no connection yet) is healthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7813/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state!=='broken'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

volumes:
  pae-data:
